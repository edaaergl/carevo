<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Carevo - İşletme Paneli</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { color: #e5e7eb; }
    .kutu {
      max-width: none;
      margin: 0 0 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }
    input, select {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    select option {
      color: #111;
    }
    table {
      background: rgba(255, 255, 255, 0.05);
      box-shadow: none;
    }
    th, td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#0a1220] to-[#16233f]">
  <div class="panel">
    <div class="ust-bar">
      <h1 id="isletme-basligi">İşletme Paneli</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="index.html" target="_blank" style="padding:10px 16px; background:rgba(255,255,255,0.1); color:white; border:1px solid rgba(255,255,255,0.2); border-radius:4px; font-size:14px; text-decoration:none;">Ana Sayfaya Git</a>
        <button id="cikis-btn">Çıkış Yap</button>
      </div>
    </div>

    <!-- Henuz isletme profili yoksa gosterilecek form -->
    <div id="profil-olustur-bolumu" class="kutu gizli">
      <h2 class="bolum-baslik">🏢 İşletme Profilini Tamamla</h2>
      <form id="profil-formu">
        <label for="isletme_adi">İşletme Adı</label>
        <input type="text" id="isletme_adi" required>

        <label for="adres">Adres</label>
        <input type="text" id="adres">

        <button type="submit" class="w-full rounded-lg bg-[#2f6fed] py-2.5 font-bold text-white transition-all duration-300 hover:scale-[1.02] hover:bg-[#2559c4]">Profili Oluştur</button>
      </form>
    </div>

    <!-- Isletme profili varsa hizmet yonetimi ve randevu tablosu -->
    <div id="randevu-bolumu" class="gizli">
      <div class="kutu" style="margin:0 0 30px 0;">
        <h2 class="bolum-baslik">🏢 İşletme Profili</h2>

        <form id="profil-duzenle-formu">
          <div class="form-grid-2">
            <div>
              <label for="profil-isletme-adi">İşletme Adı</label>
              <input type="text" id="profil-isletme-adi" required>
            </div>
            <div>
              <label for="profil-adres">Adres</label>
              <input type="text" id="profil-adres">
            </div>
          </div>

          <label for="profil-aciklama">Açıklama</label>
          <input type="text" id="profil-aciklama">

          <button type="submit" class="btn-birincil" style="width:100%; margin-top:18px;">Profili Güncelle</button>
        </form>
        <p id="profil-guncelleme-mesaji" class="gizli" style="margin-top:10px; font-size:13px; color:#7fb0ff;">Profil güncellendi.</p>
      </div>

      <div class="kutu" style="margin:0 0 30px 0;">
        <h2 class="bolum-baslik">🧾 Hizmetlerim</h2>

        <form id="hizmet-formu" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
          <div style="flex:1; min-width:180px;">
            <label for="hizmet-ad">Hizmet Adı</label>
            <input type="text" id="hizmet-ad" placeholder="Örn. Dış Yıkama" required>
          </div>
          <div style="width:120px;">
            <label for="hizmet-fiyat">Fiyat (TL)</label>
            <input type="number" id="hizmet-fiyat" min="0" step="0.01" required>
          </div>
          <div style="width:140px;">
            <label for="hizmet-sure">Süre (dk)</label>
            <input type="number" id="hizmet-sure" min="0" placeholder="Opsiyonel">
          </div>
          <button type="submit" class="btn-birincil" style="height:42px; margin-top:0;">Hizmet Ekle</button>
        </form>

        <table style="margin-top:20px;">
          <thead>
            <tr>
              <th>Hizmet Adı</th>
              <th>Fiyat</th>
              <th>Süre</th>
              <th>İşlemler</th>
            </tr>
          </thead>
          <tbody id="hizmet-govde"></tbody>
        </table>
        <p id="hizmet-bos-mesaji" class="gizli" style="margin-top:10px; font-size:13px; color:#9ca3af;">Henüz hizmet eklemediniz.</p>
      </div>

      <div class="kutu">
        <h2 class="bolum-baslik">📋 Gelen Randevular</h2>
        <table>
          <thead>
            <tr>
              <th>Müşteri</th>
              <th>Telefon</th>
              <th>Hizmet</th>
              <th>Araç</th>
              <th>Tarih / Saat</th>
              <th>Konum</th>
              <th>Ücret</th>
              <th>Durum</th>
              <th>Ödeme</th>
              <th>İşlemler</th>
            </tr>
          </thead>
          <tbody id="randevu-govde"></tbody>
        </table>
        <div id="bos-mesaji" class="bos-durum gizli">
          <span class="simge">📭</span>
          Henüz randevu yok.
        </div>
      </div>
    </div>
  </div>

  <script src="js/guvenlik.js"></script>
  <script src="js/isletme-panel.js"></script>
  <script src="js/whatsapp-widget.js"></script>
</body>
</html>
