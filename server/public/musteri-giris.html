<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Carevo - Müşteri Girişi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="kutu">
    <h1>Müşteri Girişi</h1>

    <form id="giris-formu">
      <label for="email">E-posta</label>
      <input type="email" id="email" required>

      <label for="sifre">Şifre</label>
      <input type="password" id="sifre" required>

      <button type="submit">Giriş Yap</button>
    </form>

    <p id="hata-mesaji" class="hata gizli"></p>

    <p style="margin-top:20px; font-size:13px;">
      Hesabın yok mu? <a href="musteri-kayit.html">Müşteri hesabı oluştur</a>
    </p>
  </div>

  <script src="js/musteri-giris.js"></script>
</body>
</html>
