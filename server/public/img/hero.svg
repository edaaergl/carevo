<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#3a5182" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6cdf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2d6cdf" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5578bd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5578bd" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- light streaks -->
  <rect x="150" y="-50" width="6" height="700" fill="#ffffff" opacity="0.04" transform="rotate(18 150 300)"/>
  <rect x="720" y="-50" width="10" height="700" fill="#ffffff" opacity="0.03" transform="rotate(18 720 300)"/>
  <rect x="980" y="-50" width="4" height="700" fill="#ffffff" opacity="0.05" transform="rotate(18 980 300)"/>

  <!-- falling water droplets -->
  <g fill="#bcd2f5">
    <ellipse cx="220" cy="140" rx="4" ry="10" opacity="0.35" transform="rotate(15 220 140)"/>
    <ellipse cx="340" cy="220" rx="3" ry="8" opacity="0.3" transform="rotate(15 340 220)"/>
    <ellipse cx="880" cy="110" rx="4" ry="11" opacity="0.3" transform="rotate(15 880 110)"/>
    <ellipse cx="1010" cy="200" rx="3" ry="9" opacity="0.35" transform="rotate(15 1010 200)"/>
    <ellipse cx="600" cy="90" rx="3" ry="8" opacity="0.28" transform="rotate(15 600 90)"/>
    <ellipse cx="460" cy="260" rx="3" ry="9" opacity="0.25" transform="rotate(15 460 260)"/>
    <ellipse cx="1080" cy="320" rx="4" ry="10" opacity="0.3" transform="rotate(15 1080 320)"/>
  </g>

  <!-- soft bubbles -->
  <circle cx="120" cy="360" r="46" fill="#ffffff" opacity="0.04"/>
  <circle cx="1050" cy="420" r="34" fill="#ffffff" opacity="0.05"/>
  <circle cx="650" cy="150" r="20" fill="#ffffff" opacity="0.06"/>

  <!-- abstract water waves -->
  <path d="M0 430 Q 150 390 300 420 T 600 415 T 900 425 T 1200 400 V 600 H 0 Z" fill="url(#wave1)"/>
  <path d="M0 480 Q 200 440 400 470 T 800 465 T 1200 450 V 600 H 0 Z" fill="url(#wave2)"/>
  <path d="M0 530 Q 250 500 500 525 T 1000 515 T 1200 520 V 600 H 0 Z" fill="#0d1626" opacity="0.5"/>
</svg>
