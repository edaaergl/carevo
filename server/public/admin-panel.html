<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Carevo - Yönetici Paneli</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      color: #e5e7eb;
    }
    .istatistik-satiri {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .istatistik-kart {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 8px;
      flex: 1;
      min-width: 160px;
    }
    .istatistik-kart .sayi {
      font-size: 24px;
      font-weight: bold;
      color: #7fb0ff;
    }
    .istatistik-kart .etiket {
      font-size: 12px;
      color: #9ca3af;
    }
    section {
      margin-bottom: 40px;
    }
    table {
      background: rgba(255, 255, 255, 0.05);
      box-shadow: none;
    }
    th, td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    input, select {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    input::placeholder {
      color: #9ca3af;
    }
    select option {
      color: #111;
    }
    .durum-sec {
      width: auto;
      display: inline-block;
    }
    #isletme-govde tr[data-id],
    #kullanici-govde tr[data-id] {
      cursor: pointer;
    }
    #isletme-govde tr[data-id]:hover,
    #kullanici-govde tr[data-id]:hover {
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#0a1220] to-[#16233f]">
  <div class="panel">
    <div class="ust-bar">
      <h1 id="admin-basligi">Yönetici Paneli</h1>
      <button id="cikis-btn">Çıkış Yap</button>
    </div>

    <div class="istatistik-satiri" id="istatistik-satiri"></div>

    <section>
      <h1>Tüm Randevular</h1>
      <table>
        <thead>
          <tr>
            <th>İşletme</th>
            <th>Müşteri</th>
            <th>Hizmet</th>
            <th>Araç</th>
            <th>Tarih / Saat</th>
            <th>Ücret</th>
            <th>Durum</th>
            <th>Ödeme</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody id="randevu-govde"></tbody>
      </table>
    </section>

    <section>
      <h1>Tüm İşletmeler</h1>
      <input type="text" id="isletme-arama" placeholder="İşletme adı, adres veya e-posta ara..." style="margin-bottom:14px;">
      <table>
        <thead>
          <tr>
            <th>İşletme Adı</th>
            <th>Adres</th>
            <th>Sahip E-posta</th>
          </tr>
        </thead>
        <tbody id="isletme-govde"></tbody>
      </table>
      <p id="isletme-bos-mesaji" class="gizli" style="margin-top:10px; font-size:13px; color:#9ca3af;">Aramanla eşleşen işletme bulunamadı.</p>
    </section>

    <section>
      <h1>Tüm Kullanıcılar</h1>
      <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
        <input type="text" id="kullanici-arama" placeholder="Ad soyad veya e-posta ara..." style="flex:1; min-width:220px;">
        <select id="kullanici-rol-filtre" style="max-width:180px;">
          <option value="">Tüm roller</option>
          <option value="musteri">Sadece müşteri</option>
          <option value="isletme">Sadece işletme</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Ad Soyad</th>
            <th>E-posta</th>
            <th>Telefon</th>
            <th>Rol</th>
            <th>Kayıt Tarihi</th>
          </tr>
        </thead>
        <tbody id="kullanici-govde"></tbody>
      </table>
      <p id="kullanici-bos-mesaji" class="gizli" style="margin-top:10px; font-size:13px; color:#9ca3af;">Aramanla eşleşen kullanıcı bulunamadı.</p>
    </section>
  </div>

  <div id="detay-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4">
    <div class="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-xl border border-white/10 bg-[#16233f] p-6 shadow-2xl">
      <div class="mb-4 flex items-start justify-between gap-4">
        <div id="detay-baslik" class="text-lg font-bold text-white"></div>
        <button id="detay-kapat" type="button" class="text-2xl leading-none text-gray-400 hover:text-white">&times;</button>
      </div>
      <div id="detay-icerik" class="text-sm text-gray-300"></div>
    </div>
  </div>

  <script src="js/admin-panel.js"></script>
  <script src="js/whatsapp-widget.js"></script>
</body>
</html>
